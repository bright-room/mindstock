services:
  postgres:
    image: "postgres:18.0-alpine"
    container_name: "mindstock-postgres"
    environment:
      POSTGRES_DB: "mindstock"
      POSTGRES_USER: "mindstock"
      POSTGRES_PASSWORD: "mindstock"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      TZ: "Asia/Tokyo"
    ports:
      - "5432:5432"
    volumes:
      # PG 18 moved some paths out of /var/lib/postgresql/data, so mount the
      # parent directory to cover everything the image writes.
      - "mindstock-pgdata:/var/lib/postgresql"
      - "./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindstock -d mindstock"]
      interval: "20s"
      timeout: "5s"
      retries: 3
    restart: "unless-stopped"

  zitadel:
    image: "ghcr.io/zitadel/zitadel:v4.15.0"
    container_name: "mindstock-zitadel"
    command: 'start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled'
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: "postgres"
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: "zitadel"
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: "zitadel"
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "zitadel"
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: "disable"
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: "mindstock"
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "mindstock"
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: "disable"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: "localhost"
      ZITADEL_EXTERNALPORT: "8081"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: "admin@localhost"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "Password1!"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: "service_healthy"
    restart: "unless-stopped"

volumes:
  mindstock-pgdata:
