ktor:
  environment: "$KTOR_ENV:LOCAL"
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - net.brightroom.mindstock.MainKt.module

external:
  datasource:
    database:
      driver-class-name: "org.postgresql.Driver"
      jdbc-url: "$DATABASE_URL:jdbc:postgresql://localhost:5432/mindstock"
      username: "$DATABASE_USERNAME:mindstock"
      password: "$DATABASE_PASSWORD:mindstock"
      maximum-pool-size: 10
      auto-commit: false
      transaction-isolation: "TRANSACTION_REPEATABLE_READ"
