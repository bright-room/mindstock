ktor:
  deployment:
    port: "$PORT:8080"
    host: "0.0.0.0"
  application:
    modules:
      - net.brightroom.mindstock.backend.MainKt.module

database:
  jdbcUrl: "$DATABASE_URL:jdbc:postgresql://localhost:5432/mindstock"
  username: "$DATABASE_USERNAME:mindstock"
  password: "$DATABASE_PASSWORD:mindstock"
