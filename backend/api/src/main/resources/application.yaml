ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - "net.brightroom.mindstock.configuration.migration.MigrationConfigurationKt.migrationConfigure"
      - "net.brightroom.mindstock.configuration.external.exposed.ExposedConfigurationKt.exposedConfigure"
      - "net.brightroom.mindstock.configuration.external.storage.StorageConfigurationKt.storageConfigure"
      - "net.brightroom.mindstock.configuration.di.DependenciesConfigurationKt.dependenciesConfigure"
      - "net.brightroom.mindstock.configuration.routing.RoutingConfigurationKt.routingConfigure"

external:
  auth:
    issuer: "$AUTH_ISSUER"
    audience: "$AUTH_AUDIENCE"
    jwks-url: "$AUTH_JWKS_URL"
  datasource:
    database:
      driver-class-name: "org.postgresql.Driver"
      jdbc-url: "$DB_JDBC_URL:jdbc:postgresql://localhost:5432/mindstock"
      username: "$DB_USERNAME:mindstock"
      password: "$DB_PASSWORD:mindstock"
  storage:
    endpoint: "$STORAGE_ENDPOINT:http://localhost:3900"
    region: "$STORAGE_REGION:garage"
    bucket: "$STORAGE_BUCKET:mindstock-images"
    # access/secret は dev 用の固定値をデフォルトにする(docker/garage-init.sh が import する
    # 固定キーと一致)。本番は環境変数で上書きする。postgres の mindstock/mindstock と同じ posture。
    access-key: "$STORAGE_ACCESS_KEY:GKdeadbeefdeadbeefdeadbeef"
    secret-key: "$STORAGE_SECRET_KEY:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
    cors-allowed-origins: "$STORAGE_CORS_ORIGINS:http://localhost:8080"
