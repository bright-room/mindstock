[tools]
java = "openjdk-25"

[env]
# backend dev port (frontend dev server takes 8080)
PORT = "8090"
# Test DB (postgres-test service on port 5433)
TEST_DB_URL = "jdbc:postgresql://localhost:5432/mindstock_test"
TEST_DB_USER = "mindstock"
TEST_DB_PASSWORD = "mindstock"
# Zitadel の AUTH_*(AUTH_ISSUER / AUTH_CLIENT_ID / AUTH_AUDIENCE / AUTH_PROJECT_ID /
# AUTH_REDIRECT_URI / AUTH_POST_LOGOUT_REDIRECT_URI / AUTH_JWKS_URL)は
# `docker compose up` が生成する .env.zitadel から読む(直書きしない)。
_.file = ".env.zitadel"
