name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: mindstock
          POSTGRES_PASSWORD: mindstock
          POSTGRES_DB: mindstock_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mindstock -d mindstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Check
        # AUTH_* は frontend/build.gradle.kts:generateAuthConfig が要求する。
        # CI ではコンパイルが通れば十分なので placeholder で埋める。実 deploy には別途設定。
        env:
          AUTH_CLIENT_ID: ci-placeholder
          AUTH_AUDIENCE: ci-placeholder
          AUTH_PROJECT_ID: ci-placeholder
          TEST_DB_URL: jdbc:postgresql://localhost:5433/mindstock_test
          TEST_DB_USER: mindstock
          TEST_DB_PASSWORD: mindstock
        run: ./gradlew check

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
