name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR は新しい push で古い run を cancel(CI 分節約)。
# main(push)は cancel せず全コミットを完走させる:
#   - 各コミットの CI 検証を残す(Renovate automerge 対応)
#   - setup-gradle のキャッシュ seed を各コミットで行う
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Spotless check
        run: ./gradlew spotlessCheck

  test-backend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Unit tests (JVM)
        run: ./gradlew test jvmTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-test-backend
          path: |
            **/build/reports/
            **/build/test-results/

  test-frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Browser tests (JS/Wasm)
        # AUTH_* は frontend/build.gradle.kts:generateAuthConfig が要求する。
        # CI ではコンパイルが通れば十分なので placeholder で埋める。
        # WasmJs compile で OOM したら -Pkotlin.daemon.jvmargs=-Xmx6144M を付与する。
        env:
          AUTH_CLIENT_ID: ci-placeholder
          AUTH_AUDIENCE: ci-placeholder
          AUTH_PROJECT_ID: ci-placeholder
        run: ./gradlew jsTest wasmJsTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-test-frontend
          path: |
            **/build/reports/
            **/build/test-results/

  integration-test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: mindstock
          POSTGRES_PASSWORD: mindstock
          POSTGRES_DB: mindstock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindstock -d mindstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Integration tests
        # テスト用 HikariCP プールはキャップ済み(TestDataSource / E2E アプリプール)。
        # default 並列度で接続枯渇しない。詳細は
        # docs/superpowers/specs/2026-05-30-integration-test-pool-capping-design.md
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/mindstock_test
          TEST_DB_USER: mindstock
          TEST_DB_PASSWORD: mindstock
        run: ./gradlew :backend:api:integrationTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-integration-test
          path: |
            **/build/reports/
            **/build/test-results/

  storage-integration-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Start Garage (S3-compatible storage)
        # GHA の service container は checkout 前に起動するため config.toml を mount できず、
        # layout/bucket/key の post-start 初期化もできない。よって repo の compose 定義
        # (garage + garage-init)をそのまま使う。garage-init が .env.garage に資格情報を書く。
        run: |
          docker compose up -d garage
          docker compose run --rm garage-init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Storage integration tests
        # ブラウザ経路(CORS)ではなく JVM S3 クライアントの store→presign→GET 往復を検証する。
        # CORS は JVM HTTP では強制されないため backend 起動は不要(bucket/key だけあればよい)。
        run: |
          set -a
          . ./.env.garage
          set +a
          export TEST_STORAGE_ENDPOINT="$STORAGE_ENDPOINT" \
                 TEST_STORAGE_BUCKET="$STORAGE_BUCKET" \
                 TEST_STORAGE_ACCESS_KEY="$STORAGE_ACCESS_KEY" \
                 TEST_STORAGE_SECRET_KEY="$STORAGE_SECRET_KEY"
          ./gradlew :backend:core:integrationTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-storage-integration-test
          path: |
            **/build/reports/
            **/build/test-results/
