name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR は新しい push で古い run を cancel(CI 分節約)。
# main(push)は cancel せず全コミットを完走させる:
#   - 各コミットの CI 検証を残す(Renovate automerge 対応)
#   - setup-gradle のキャッシュ seed を各コミットで行う
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up JDK
        # ローカルは mise(openjdk-25)/ foojay resolver で JDK 解決。CI はこの setup-java を正とする。
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Spotless check
        run: ./gradlew spotlessCheck

  test-backend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Unit tests (JVM)
        # test と jvmTest は対象が分離している(重複ではない):
        #   test    → :backend:* (kotlin-jvm モジュール)
        #   jvmTest → :domain / :rpc / :shared (KMP モジュール。test タスクを持たない)
        # どちらを外しても片方のモジュール群のテストが CI から落ちるため両方必須。
        run: ./gradlew test jvmTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-test-backend
          path: |
            **/build/reports/
            **/build/test-results/

  test-frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Browser tests (JS/Wasm)
        # AUTH_* は frontend/build.gradle.kts:generateAuthConfig が要求する。
        # CI ではコンパイルが通れば十分なので placeholder で埋める。
        # WasmJs compile で OOM したら -Pkotlin.daemon.jvmargs=-Xmx6144M を付与する。
        env:
          AUTH_CLIENT_ID: ci-placeholder
          AUTH_PROJECT_ID: ci-placeholder
        run: ./gradlew jsTest wasmJsTest

      - name: Production wasm build (成果物コンパイル検証)
        # テストは成果物の破損(本番 wasm compile)を検知しない。本番ビルドの compile だけ検証する
        # (フル wasmJsBrowserDistribution は重く OOM 実績があるため compile タスクに留める)。
        # OOM したら run に -Pkotlin.daemon.jvmargs=-Xmx6144M を付与する。
        env:
          AUTH_CLIENT_ID: ci-placeholder
          AUTH_PROJECT_ID: ci-placeholder
        run: ./gradlew compileProductionExecutableKotlinWasmJs

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-test-frontend
          path: |
            **/build/reports/
            **/build/test-results/

  integration-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Start services (Postgres + Garage) via compose
        # dev と同じ compose 定義を CI でも使い provisioning を一本化する。
        # postgres: docker/postgres-init.sh が initdb で mindstock_test を作る(--wait で healthy 待ち)。
        # garage:   garage-init が layout/bucket/固定 dev キーを用意する(資格情報は固定で
        #           application.yaml デフォルト = テスト既定値と一致するため env 注入は不要)。
        run: |
          docker compose up -d --wait postgres garage
          docker compose run --rm garage-init

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Integration tests
        # backend:api は Postgres(mindstock_test)、backend:core は Garage に当てる。
        # storage は app と同じ STORAGE_* を読み、既定値は garage-init の固定キーと一致するため
        # ここで storage の env を設定する必要はない。JVM S3 クライアントの store→presign→GET
        # 往復を検証する(CORS は JVM HTTP では強制されないため backend 起動は不要)。
        # テスト用 HikariCP プールはキャップ済み(TestDataSource / E2E アプリプール)。
        # default 並列度で接続枯渇しない。詳細は
        # docs/superpowers/specs/2026-05-30-integration-test-pool-capping-design.md
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/mindstock_test
          TEST_DB_USER: mindstock
          TEST_DB_PASSWORD: mindstock
        run: ./gradlew :backend:api:integrationTest :backend:core:integrationTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-integration-test
          path: |
            **/build/reports/
            **/build/test-results/
